<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #F6F6FB;
        --page: #EFEFF6;
        --surface: #FFFFFF;
        --border: #E7E7F1;
        --text: #1E2130;
        --text-muted: #71748A;
        --primary: #46BDC6;
        --primary-hover: #379BA3;
        --primary-soft: #E3F5F6;
        --success: #0F9D58;
        --success-soft: #E9F9EF;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 16px;
        margin: 0;
      }

      h1 {
        font-family: 'Manrope', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 18px;
        margin: 0 0 16px;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 16px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        font-size: 13px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 16px;
        margin-bottom: 14px;
      }

      .eyebrow {
        font-family: 'Manrope', sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 0 0 12px;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .card-head .eyebrow {
        margin: 0;
      }

      .reset-link {
        font-size: 12px;
        font-weight: 600;
        color: var(--primary);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        margin: 0;
      }

      .select-wrap {
        position: relative;
      }

      select,
      input[type="number"],
      input[type="text"] {
        width: 100%;
        padding: 11px 13px;
        margin-bottom: 12px;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        font-family: 'Inter', sans-serif;
        font-size: 13.5px;
        color: var(--text);
      }

      select {
        appearance: none;
        -webkit-appearance: none;
        padding-right: 36px;
        cursor: pointer;
      }

      select:focus,
      input[type="number"]:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }

      input::placeholder {
        color: #B0B2C2;
      }

      .select-wrap::after {
        content: "";
        position: absolute;
        right: 13px;
        top: 50%;
        width: 8px;
        height: 8px;
        border-right: 2px solid var(--text-muted);
        border-bottom: 2px solid var(--text-muted);
        transform: translateY(-70%) rotate(45deg);
        pointer-events: none;
      }

      select[multiple] {
        min-height: 100px;
      }

      button {
        cursor: pointer;
        font-family: 'Inter', sans-serif;
      }

      #surveyInfo,
      #filtersError {
        margin-top: 8px;
        font-size: 12.5px;
      }

      .error {
        color: #C0392B;
      }

      .filters-block {
        margin-bottom: 0;
      }

      .filter-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        margin-bottom: 8px;
      }

      .filter-item .filter-title {
        font-weight: 700;
      }

      .operator-row {
        display: flex;
        gap: 8px;
      }

      .operator-row select,
      .operator-row input {
        margin-bottom: 0;
      }

      /* segmented mode control */
      .mode-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }

      .mode-row label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-weight: normal;
        font-size: 13px;
        line-height: 1.35;
        margin-bottom: 0;
        border: 1.5px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        cursor: pointer;
        transition: border-color .15s, background .15s;
      }

      .mode-row label:has(input:checked) {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .mode-row input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid var(--border);
        margin: 1px 0 0;
        flex-shrink: 0;
        position: relative;
      }

      .mode-row label:has(input:checked) input[type="radio"] {
        border-color: var(--primary);
      }

      .mode-row input[type="radio"]:checked::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: var(--primary);
      }

      .filter-item .filter-mode {
        display: block;
        color: var(--text-muted);
        font-size: 12px;
        margin-top: 4px;
      }

      .hint {
        color: var(--text-muted);
        margin: -6px 0 12px;
        font-size: 12px;
      }

      .dept-groups {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        margin-bottom: 8px;
      }

      .dept-group-row {
        display: flex;
        align-items: center;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 4px;
      }

      .dept-group-row:last-child {
        margin-bottom: 0;
      }

      .dept-group-row input[type="checkbox"] {
        width: auto;
        accent-color: var(--primary);
        margin: 0 8px 0 0;
      }

      .report-line {
        margin-top: 2px;
      }

      /* toggle switch */
      .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
      }

      .row-between span {
        font-size: 13px;
        font-weight: 500;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 22px;
        flex-shrink: 0;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .switch .slider {
        position: absolute;
        inset: 0;
        background: #D9DAE6;
        border-radius: 20px;
        cursor: pointer;
        transition: background .18s;
      }

      .switch .slider::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform .18s;
        box-shadow: 0 1px 3px rgba(0,0,0,.25);
      }

      .switch input:checked + .slider {
        background: var(--primary);
      }

      .switch input:checked + .slider::after {
        transform: translateX(16px);
      }

      /* chip multiselect */
      .multiselect-ui {
        margin-bottom: 8px;
      }

      .chip-box {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        min-height: 40px;
        max-height: 84px;
        overflow: hidden;
        transition: max-height .18s;
      }

      .chip-box.expanded {
        max-height: 220px;
        overflow-y: auto;
      }

      .show-more-pill {
        display: none;
        margin: 6px 0 8px;
        padding: 4px 10px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: 11.5px;
        font-weight: 600;
        color: var(--primary);
        transition: border-color .15s, background .15s;
      }

      .show-more-pill:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .chip {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--primary-soft);
        color: var(--primary-hover);
        font-size: 12.5px;
        font-weight: 600;
        padding: 5px 6px 5px 10px;
        border-radius: 20px;
        max-width: 100%;
      }

      .chip-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 210px;
      }

      .chip button {
        border: none;
        background: rgba(70,189,198,.18);
        color: var(--primary-hover);
        width: 16px;
        height: 16px;
        border-radius: 50%;
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex-shrink: 0;
      }

      .search-input {
        margin-bottom: 8px !important;
      }

      .option-list {
        max-height: 150px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
      }

      .option-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 12px;
        font-size: 13.5px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        margin-bottom: 0;
        font-weight: normal;
      }

      .option-row:last-child {
        border-bottom: none;
      }

      .option-row:hover {
        background: var(--primary-soft);
      }

      .option-row input {
        accent-color: var(--primary);
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }

      .option-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .count-badge {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 7px;
      }

      /* active filters accordion */
      .accordion {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }

      .accordion-header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        background: var(--primary-soft);
        border: none;
        font-family: 'Inter', sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text);
      }

      .accordion-chevron {
        color: var(--text-muted);
        font-size: 10px;
        transition: transform .18s;
        flex-shrink: 0;
      }

      .accordion.expanded .accordion-chevron {
        transform: rotate(180deg);
      }

      .accordion-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height .18s;
      }

      .accordion.expanded .accordion-body {
        max-height: 200px;
        overflow-y: auto;
        padding: 10px;
      }

      .accordion-body .filter-item {
        margin-bottom: 8px;
      }

      .accordion-body .filter-item:last-child {
        margin-bottom: 0;
      }

      /* ghost / secondary buttons */
      .ghost-row {
        display: flex;
        gap: 8px;
        margin-top: 2px;
      }

      .btn-ghost {
        flex: 1;
        padding: 10px;
        border-radius: var(--radius-sm);
        border: 1.5px dashed var(--border);
        background: transparent;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-muted);
        transition: border-color .15s, color .15s;
      }

      .btn-ghost:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .cta {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: var(--radius-md);
        background: var(--primary);
        color: #fff;
        font-family: 'Manrope', sans-serif;
        font-weight: 700;
        font-size: 14px;
        transition: background .15s, transform .1s;
        box-shadow: 0 10px 20px -8px rgba(70,189,198,.55);
      }

      .cta:hover {
        background: var(--primary-hover);
      }

      .cta:active {
        transform: scale(.98);
      }

      .btn-secondary {
        width: 100%;
        padding: 11px;
        margin-top: 8px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-weight: 600;
        font-size: 13px;
        transition: border-color .15s, color .15s;
      }

      .btn-secondary:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <h1>HR Analytics</h1>

    <div class="card">
      <p class="eyebrow">Источник данных</p>
      <label for="dataSource">Источник данных:</label>
      <div class="select-wrap">
        <select id="dataSource">
          <option value="2026" selected>Ответы 2026</option>
          <option value="2025">Ответы 2025</option>
        </select>
      </div>

      <div id="compareBlock" class="row-between" style="display:none;">
        <span>Сравнить с 2025</span>
        <label class="switch">
          <input type="checkbox" id="compareWith2025">
          <span class="slider"></span>
        </label>
      </div>

      <div id="cohortBlock" class="row-between" style="display:none;">
        <span>Только сквозная когорта — сотрудники, ответившие в 2025 и 2026</span>
        <label class="switch">
          <input type="checkbox" id="cohortOnly">
          <span class="slider"></span>
        </label>
      </div>
      <div id="cohortHint" class="hint" style="display:none;">
        Отчет будет построен только по сотрудникам, ответившим оба года, и будет содержать их ФИО.
      </div>
    </div>

    <div class="card filters-block">
      <div class="card-head">
        <p class="eyebrow">Фильтры</p>
        <button type="button" class="reset-link" id="resetFiltersBtn">Сбросить фильтры</button>
      </div>

      <label for="questionSelect">Вопрос</label>
      <div class="select-wrap">
        <select id="questionSelect"></select>
      </div>

      <div id="filterEditor"></div>

      <div class="ghost-row">
        <button type="button" class="btn-ghost" id="addFilterBtn">+ Добавить фильтр</button>
      </div>

      <div id="activeFilters"></div>

      <div id="filtersError"></div>
    </div>

    <div class="card">
      <p class="eyebrow">Отчёт</p>
      <label for="reportName">Название отчета (необязательно)</label>
      <input type="text" id="reportName" placeholder="Например: Отдел продаж">
      <div id="reportNameHint" class="hint" style="display:none;">
        Отчетов будет несколько — каждый называется своим значением фильтра.
      </div>
    </div>

    <button type="button" class="cta" id="buildReportBtn">Создать отчет</button>
    <button type="button" class="btn-secondary" id="checkDataBtn">Проверить данные</button>
    <div id="surveyInfo"></div>

    <script>
      var SINGLE_MODE = 'single';
      var SPLIT_MODE = 'split';

      var filterQuestions = [];
      var activeFilters = [];

      var DEPARTMENT_QUESTION_TITLE = 'Отдел';

      /**
       * Группы отделов ("управления") для быстрого выбора в фильтре
       * "Отдел". Выбор группы заменяет текущую выборку отделов и
       * взаимоисключает выбор другой группы. Названия отделов должны
       * дословно совпадать со значениями в Questions.gs — часть отделов
       * из исходных списков управлений не входит в опросник и здесь не
       * учтена (сверено и подтверждено отдельно).
       */
      var DEPARTMENT_GROUPS = [
        {
          id: 'itUpravlenie',
          title: 'IT-управление',
          departments: [
            'HR-отдел',
            'Администрация IT',
            'PR-отдел',
            'Отдел внедрения и обслуживания учетных систем',
            'Отдел информационной безопасности инфраструктуры',
            'Отдел обслуживания платежных систем',
            'Отдел обучения',
            'Отдел поддержки и управления сервисами IP-телефонии',
            'Отдел программируемых микроконтроллеров',
            'Отдел промышленной автоматизации',
            'Отдел связи',
            'Отдел серверных решений и СХД',
            'Отдел сетевых технологий',
            'Отдел системного администрирования',
            'Отдел технической поддержки',
            'Отдел эксплуатации сети'
          ]
        },
        {
          id: 'razrabotkaPo',
          title: 'Управление разработки ПО',
          departments: [
            'Отдел автоматизации операционной деятельности',
            'Отдел аналитики и управления данными',
            'Отдел бизнес-анализа',
            'Отдел локализации и перевода',
            'Отдел поддержки прикладного программного обеспечения',
            'Отдел проектирования и дизайна интерфейсов',
            'Отдел развития продуктов',
            'Отдел разработки биллинг сервисов',
            'Отдел разработки водительских сервисов',
            'Отдел разработки гео сервисов',
            'Отдел разработки интегрированных систем',
            'Отдел разработки инфраструктурных сервисов',
            'Отдел разработки клиентских сервисов',
            'Отдел разработки мобильного ПО',
            'Отдел разработки сайтов',
            'Отдел разработки сервисов заказа',
            'Отдел разработки технической документации',
            'Отдел системного анализа',
            'Отдел тестирования ПО',
            'Отдел управления процессами'
          ]
        }
      ];

      function isOperatorType(type) {
        return type === 'rating5' || type === 'enps';
      }

      function findQuestion(name) {
        return filterQuestions.filter(function(q) {
          return q.question === name;
        })[0];
      }

      function renderQuestionSelect() {
        var select = document.getElementById('questionSelect');
        select.innerHTML = '';

        filterQuestions.forEach(function(q) {
          var option = document.createElement('option');
          option.value = q.question;
          option.textContent = q.question;
          select.appendChild(option);
        });
      }

      function renderFilterEditor() {
        var editor = document.getElementById('filterEditor');
        editor.innerHTML = '';

        var selectedName = document.getElementById('questionSelect').value;
        var question = findQuestion(selectedName);

        if (!question) {
          return;
        }

        if (isOperatorType(question.type)) {
          var row = document.createElement('div');
          row.className = 'operator-row';

          var operatorSelect = document.createElement('select');
          operatorSelect.className = 'filterOperator';
          question.operators.forEach(function(op) {
            var option = document.createElement('option');
            option.value = op;
            option.textContent = op;
            operatorSelect.appendChild(option);
          });

          var valueInput = document.createElement('input');
          valueInput.type = 'number';
          valueInput.className = 'filterValue';

          row.appendChild(operatorSelect);
          row.appendChild(valueInput);
          editor.appendChild(row);
        } else {
          var optionsSelect = document.createElement('select');
          optionsSelect.className = 'filterOptions';
          optionsSelect.multiple = true;
          optionsSelect.style.display = 'none';

          question.options.forEach(function(value) {
            var option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            optionsSelect.appendChild(option);
          });

          var multiselectUI = buildMultiselectUI(optionsSelect);

          if (question.question === DEPARTMENT_QUESTION_TITLE) {
            editor.appendChild(renderDepartmentGroups(optionsSelect, multiselectUI.refresh));
          }

          editor.appendChild(optionsSelect);
          editor.appendChild(multiselectUI.element);
          editor.appendChild(renderModeRow());
        }
      }

      /**
       * Визуальная надстройка над скрытым select[multiple].filterOptions:
       * чипы выбранных значений, поиск по списку и чекбоксы. Сам select
       * остаётся источником истины — addFilterFromEditor и синхронизация
       * групп отделов продолжают читать/писать его через selectedOptions
       * и option.selected, не зная о существовании этой надстройки.
       */
      function buildMultiselectUI(optionsSelect) {
        var wrap = document.createElement('div');
        wrap.className = 'multiselect-ui';

        var chipBox = document.createElement('div');
        chipBox.className = 'chip-box';

        var chipsExpanded = false;

        var showMoreBtn = document.createElement('button');
        showMoreBtn.type = 'button';
        showMoreBtn.className = 'show-more-pill';

        showMoreBtn.addEventListener('click', function() {
          chipsExpanded = !chipsExpanded;
          updateChipOverflow();
        });

        var search = document.createElement('input');
        search.type = 'text';
        search.className = 'search-input';
        search.placeholder = 'Поиск…';

        var list = document.createElement('div');
        list.className = 'option-list';

        var count = document.createElement('div');
        count.className = 'count-badge';

        var rows = [];

        function toggleOption(option, checked) {
          option.selected = checked;
          optionsSelect.dispatchEvent(new Event('change'));
          refresh();
        }

        Array.from(optionsSelect.options).forEach(function(option) {
          var row = document.createElement('label');
          row.className = 'option-row';

          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';

          checkbox.addEventListener('change', function() {
            toggleOption(option, checkbox.checked);
          });

          var text = document.createElement('span');
          text.className = 'option-text';
          text.textContent = option.value;
          text.title = option.value;

          row.appendChild(checkbox);
          row.appendChild(text);
          list.appendChild(row);

          rows.push({ option: option, checkbox: checkbox, row: row });
        });

        search.addEventListener('input', function() {
          var query = search.value.trim().toLowerCase();
          rows.forEach(function(r) {
            r.row.style.display = r.option.value.toLowerCase().indexOf(query) === -1 ? 'none' : '';
          });
        });

        /**
         * Сколько чипов не влезает в свёрнутый chip-box (84px), считаем
         * по фактической раскладке flex-wrap — она не меняется от
         * max-height/overflow, так что offsetTop корректен и в
         * свёрнутом, и в развёрнутом состоянии.
         */
        function updateChipOverflow() {
          var collapsedLimit = 84;
          var chips = Array.from(chipBox.children);

          var hiddenCount = chips.filter(function(chip) {
            return chip.offsetTop + chip.offsetHeight > collapsedLimit;
          }).length;

          if (hiddenCount === 0) {
            chipsExpanded = false;
            chipBox.classList.remove('expanded');
            showMoreBtn.style.display = 'none';
            return;
          }

          chipBox.classList.toggle('expanded', chipsExpanded);
          showMoreBtn.style.display = '';
          showMoreBtn.textContent = chipsExpanded ? 'Свернуть' : 'Показать ещё ' + hiddenCount;
        }

        function refresh() {
          chipBox.innerHTML = '';

          var selected = Array.from(optionsSelect.selectedOptions);

          selected.forEach(function(option) {
            var chip = document.createElement('div');
            chip.className = 'chip';

            var text = document.createElement('span');
            text.className = 'chip-text';
            text.textContent = option.value;
            text.title = option.value;
            chip.appendChild(text);

            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.textContent = '✕';
            removeBtn.addEventListener('click', function() {
              toggleOption(option, false);
            });

            chip.appendChild(removeBtn);
            chipBox.appendChild(chip);
          });

          rows.forEach(function(r) {
            r.checkbox.checked = r.option.selected;
          });

          chipBox.style.display = selected.length === 0 ? 'none' : '';

          count.textContent = 'Выбрано: ' + selected.length;
          updateChipOverflow();
        }

        refresh();

        wrap.appendChild(chipBox);
        wrap.appendChild(showMoreBtn);
        wrap.appendChild(search);
        wrap.appendChild(list);
        wrap.appendChild(count);

        return { element: wrap, refresh: refresh };
      }

      /**
       * Блок быстрого выбора управлений над списком отделов. Отмечает
       * группу отделов заменой текущей выборки в select; выбор одной
       * группы снимает отметку с другой. Ручное изменение самого select
       * ниже синхронизирует отметки — группа остается отмеченной, только
       * если её отделы выбраны в select точь-в-точь.
       */
      function renderDepartmentGroups(optionsSelect, onGroupApplied) {
        var container = document.createElement('div');
        container.className = 'dept-groups';

        DEPARTMENT_GROUPS.forEach(function(group) {
          var label = document.createElement('label');
          label.className = 'dept-group-row';

          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'deptGroupCheckbox';
          checkbox.dataset.groupId = group.id;

          checkbox.addEventListener('change', function() {
            if (checkbox.checked) {
              applyDepartmentGroup(group, optionsSelect, container);
              if (onGroupApplied) {
                onGroupApplied();
              }
            }
          });

          label.appendChild(checkbox);
          label.appendChild(document.createTextNode(group.title));
          container.appendChild(label);
        });

        optionsSelect.addEventListener('change', function() {
          syncDepartmentGroupCheckboxes(optionsSelect, container);
        });

        return container;
      }

      function applyDepartmentGroup(group, optionsSelect, container) {
        container.querySelectorAll('.deptGroupCheckbox').forEach(function(checkbox) {
          checkbox.checked = checkbox.dataset.groupId === group.id;
        });

        Array.from(optionsSelect.options).forEach(function(option) {
          option.selected = group.departments.indexOf(option.value) !== -1;
        });
      }

      function syncDepartmentGroupCheckboxes(optionsSelect, container) {
        var selectedValues = Array.from(optionsSelect.selectedOptions).map(function(o) {
          return o.value;
        });

        container.querySelectorAll('.deptGroupCheckbox').forEach(function(checkbox) {
          var group = DEPARTMENT_GROUPS.filter(function(g) {
            return g.id === checkbox.dataset.groupId;
          })[0];

          checkbox.checked = group.departments.length === selectedValues.length &&
            group.departments.every(function(department) {
              return selectedValues.indexOf(department) !== -1;
            });
        });
      }

      /**
       * Режим работы мультиселект-фильтра. Первый вариант выбран всегда
       * по умолчанию — при нем поведение полностью прежнее.
       */
      function renderModeRow() {
        var row = document.createElement('div');
        row.className = 'mode-row';

        [
          { value: SINGLE_MODE, text: 'Использовать выбранные значения как одну выборку' },
          { value: SPLIT_MODE, text: 'Построить отдельный отчет для каждого выбранного значения' }
        ].forEach(function(mode, index) {
          var label = document.createElement('label');

          var radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'filterMode';
          radio.className = 'filterMode';
          radio.value = mode.value;
          radio.checked = index === 0;

          label.appendChild(radio);
          label.appendChild(document.createTextNode(mode.text));
          row.appendChild(label);
        });

        return row;
      }

      var activeFiltersExpanded = false;

      function renderActiveFilters() {
        var container = document.getElementById('activeFilters');
        container.innerHTML = '';

        if (activeFilters.length === 0) {
          updateReportNameState();
          return;
        }

        var accordion = document.createElement('div');
        accordion.className = 'accordion';

        var header = document.createElement('button');
        header.type = 'button';
        header.className = 'accordion-header';

        var headerText = document.createElement('span');
        headerText.textContent = 'Активные фильтры (' + activeFilters.length + ')';

        var chevron = document.createElement('span');
        chevron.className = 'accordion-chevron';
        chevron.textContent = '▾';

        header.appendChild(headerText);
        header.appendChild(chevron);

        header.addEventListener('click', function() {
          activeFiltersExpanded = !activeFiltersExpanded;
          accordion.classList.toggle('expanded', activeFiltersExpanded);
        });

        var body = document.createElement('div');
        body.className = 'accordion-body';

        activeFilters.forEach(function(filter) {
          var block = document.createElement('div');
          block.className = 'filter-item';

          var title = document.createElement('span');
          title.className = 'filter-title';
          title.textContent = filter.question + ': ';
          block.appendChild(title);

          var details = isOperatorType(filter.type)
            ? filter.operator + ' ' + filter.value
            : filter.values.join(', ');

          block.appendChild(document.createTextNode(details));

          if (isSplitFilter(filter)) {
            var mode = document.createElement('span');
            mode.className = 'filter-mode';
            mode.textContent = 'Отдельный отчет для каждого значения: ' +
              filter.values.length + ' шт.';
            block.appendChild(mode);
          }

          body.appendChild(block);
        });

        accordion.classList.toggle('expanded', activeFiltersExpanded);
        accordion.appendChild(header);
        accordion.appendChild(body);
        container.appendChild(accordion);

        updateReportNameState();
      }

      function isSplitFilter(filter) {
        return filter.mode === SPLIT_MODE && !!filter.values && filter.values.length > 0;
      }

      function countBatchReports() {
        return activeFilters.reduce(function(total, filter) {
          return isSplitFilter(filter) ? total + filter.values.length : total;
        }, 0);
      }

      /**
       * Поле названия отключается, только если отчетов будет два и
       * более: тогда каждый называется своим значением фильтра и общее
       * название к ним неприменимо. Если пакетный режим включен, но
       * значение выбрано одно, отчет в итоге один — название задается
       * так же, как в обычном режиме.
       */
      function updateReportNameState() {
        var isMultiReport = countBatchReports() > 1;
        var reportName = document.getElementById('reportName');

        reportName.disabled = isMultiReport;
        document.getElementById('reportNameHint').style.display = isMultiReport ? '' : 'none';
      }

      function addFilterFromEditor() {
        var selectedName = document.getElementById('questionSelect').value;
        var question = findQuestion(selectedName);

        if (!question) {
          return;
        }

        var errorEl = document.getElementById('filtersError');
        errorEl.className = '';
        errorEl.textContent = '';

        if (isOperatorType(question.type)) {
          var operator = document.querySelector('.filterOperator').value;
          var rawValue = document.querySelector('.filterValue').value;

          if (rawValue === '') {
            errorEl.className = 'error';
            errorEl.textContent = 'Укажите значение для фильтра.';
            return;
          }

          activeFilters.push({
            question: question.question,
            dataTitle: question.dataTitle,
            type: question.type,
            operator: operator,
            value: Number(rawValue)
          });
        } else {
          var optionsSelect = document.querySelector('.filterOptions');
          var values = Array.from(optionsSelect.selectedOptions).map(function(o) {
            return o.value;
          });

          if (values.length === 0) {
            errorEl.className = 'error';
            errorEl.textContent = 'Выберите хотя бы одно значение.';
            return;
          }

          activeFilters.push({
            question: question.question,
            dataTitle: question.dataTitle,
            type: question.type,
            values: values,
            mode: document.querySelector('.filterMode:checked').value
          });
        }

        renderActiveFilters();
      }

      function resetFilters() {
        activeFilters = [];
        document.getElementById('dataSource').value = '2026';
        document.getElementById('compareWith2025').checked = false;
        document.getElementById('cohortOnly').checked = false;
        document.getElementById('surveyInfo').innerHTML = '';
        document.getElementById('surveyInfo').className = '';
        document.getElementById('filtersError').textContent = '';
        document.getElementById('filtersError').className = '';
        renderActiveFilters();
        updateCompareVisibility();
        updateCohortVisibility();
        loadFilterQuestions();
      }

      /**
       * "Сравнить с 2025" доступно только для источника 2026.
       * При переходе на 2025 сравнение принудительно выключается.
       */
      function updateCompareVisibility() {
        var source = document.getElementById('dataSource').value;
        var compareBlock = document.getElementById('compareBlock');
        var compareCheckbox = document.getElementById('compareWith2025');

        if (source === '2026') {
          compareBlock.style.display = '';
        } else {
          compareBlock.style.display = 'none';
          compareCheckbox.checked = false;
        }
      }

      /**
       * Режим "Только сквозная когорта" доступен только для источника
       * 2026 (когорта всегда строится ОТ 2026 к 2025). При переходе на
       * 2025 флажок выключается и блокировка "Сравнить с 2025" снимается.
       */
      function updateCohortVisibility() {
        var source = document.getElementById('dataSource').value;
        var cohortBlock = document.getElementById('cohortBlock');
        var cohortHint = document.getElementById('cohortHint');
        var cohortCheckbox = document.getElementById('cohortOnly');

        if (source === '2026') {
          cohortBlock.style.display = '';
          cohortHint.style.display = '';
        } else {
          cohortBlock.style.display = 'none';
          cohortHint.style.display = 'none';
          cohortCheckbox.checked = false;
        }

        updateCompareLockState();
      }

      /**
       * Включенная когорта требует сравнения с 2025 — "Сравнить с 2025"
       * автоматически включается и блокируется от ручного выключения,
       * пока когортный режим активен.
       */
      function updateCompareLockState() {
        var compareCheckbox = document.getElementById('compareWith2025');
        var cohortCheckbox = document.getElementById('cohortOnly');

        if (cohortCheckbox.checked) {
          compareCheckbox.checked = true;
          compareCheckbox.disabled = true;
        } else {
          compareCheckbox.disabled = false;
        }
      }

      function loadFilterQuestions() {
        var source = document.getElementById('dataSource').value;

        google.script.run
          .withSuccessHandler(function(questions) {
            filterQuestions = questions;
            renderQuestionSelect();
            renderFilterEditor();
          })
          .withFailureHandler(function(error) {
            var errorEl = document.getElementById('filtersError');
            errorEl.className = 'error';
            errorEl.textContent = error.message;
          })
          .getFilterableQuestions(source);
      }

      function formatFilterText(filter) {
        return isOperatorType(filter.type)
          ? filter.question + ' ' + filter.operator + ' ' + filter.value
          : filter.question + '=' + filter.values.join(', ');
      }

      /**
       * Предпросмотр единственного отчета — прежний вид сайдбара.
       */
      /**
       * Строка про использованную когорту — только цифры (размер и
       * отброшенные неоднозначные совпадения), без единого ФИО: состав
       * когорты виден только на самом листе отчета (см. Cohort.roster).
       */
      function formatCohortInfoLine(report) {
        if (!report.cohortOnly || !report.cohortInfo) return '';

        return '<br><br><b>Использована сквозная когорта</b><br>' +
          'Размер когорты: ' + report.cohortInfo.size + '<br>' +
          'Отброшено неоднозначных совпадений: ' + report.cohortInfo.droppedDuplicates;
      }

      function renderSingleResult(infoEl, source, report) {
        var filtersText = report.filters.length
          ? report.filters.map(formatFilterText).join('; ')
          : 'Без фильтров';

        // Отчет построен в любом случае — если не обновилась только
        // сводная аналитика, об этом сообщается отдельной строкой,
        // а не общей ошибкой: иначе выглядело бы так, будто отчет
        // не создан.
        var summaryWarning = report.summaryError
          ? '<br><br><span class="error">Сводная аналитика не обновлена: ' +
            report.summaryError + '</span>'
          : '';

        infoEl.innerHTML =
          '<b>Предпросмотр выборки</b><br><br>' +
          'Источник: ' + source + '<br>' +
          'Количество сотрудников: ' + report.employees + '<br><br>' +
          'Фильтры: ' + filtersText +
          formatCohortInfoLine(report) +
          summaryWarning;
      }

      /**
       * Сводка по пакету: сколько отчетов построено и что с каждым
       * значением. Значение, на котором построение упало, показывается
       * с причиной и не скрывает остальные — они построены.
       */
      function renderBatchResult(infoEl, result) {
        var built = result.reports.filter(function(report) {
          return report.ok;
        });

        infoEl.innerHTML = '';

        var title = document.createElement('b');
        title.textContent = 'Построено отчетов: ' + built.length +
          (built.length === result.reports.length ? '' : ' из ' + result.reports.length);
        infoEl.appendChild(title);

        result.reports.forEach(function(report) {
          var line = document.createElement('div');
          line.className = 'report-line';

          if (!report.ok) {
            line.className += ' error';
            line.textContent = '✗ ' + report.label + ' — ' + report.error;
            infoEl.appendChild(line);
            return;
          }

          // Имя листа показывается, только если оно отличается от
          // значения фильтра (например, к нему добавился суффикс из-за
          // уже существующего одноименного листа) — иначе это повтор.
          var sheetSuffix = report.sheetName === report.label
            ? ''
            : ' → лист "' + report.sheetName + '"';

          line.textContent = '✓ ' + report.label +
            ' (' + report.employees + ')' + sheetSuffix;

          if (report.cohortOnly && report.cohortInfo) {
            var cohortNote = document.createElement('span');
            cohortNote.textContent = ' — когорта: ' + report.cohortInfo.size +
              ', отброшено неоднозначных: ' + report.cohortInfo.droppedDuplicates;
            line.appendChild(cohortNote);
          }

          if (report.summaryError) {
            line.title = 'Сводная аналитика не обновлена: ' + report.summaryError;

            var warning = document.createElement('span');
            warning.className = 'error';
            warning.textContent = ' — сводная аналитика не обновлена';
            line.appendChild(warning);
          }

          infoEl.appendChild(line);
        });
      }

      document.getElementById('questionSelect').addEventListener('change', renderFilterEditor);
      document.getElementById('addFilterBtn').addEventListener('click', addFilterFromEditor);
      document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);
      document.getElementById('dataSource').addEventListener('change', function() {
        updateCompareVisibility();
        updateCohortVisibility();
        loadFilterQuestions();
      });
      document.getElementById('cohortOnly').addEventListener('change', updateCompareLockState);

      document.getElementById('buildReportBtn').addEventListener('click', function () {

        var source = document.getElementById('dataSource').value;
        var compareWith2025 = document.getElementById('compareWith2025').checked;
        var cohortOnly = document.getElementById('cohortOnly').checked;
        var customReportName = document.getElementById('reportName').value;
        var infoEl = document.getElementById('surveyInfo');
        var batchCount = countBatchReports();
        infoEl.className = '';
        infoEl.textContent = batchCount > 1
          ? 'Построение отчетов (' + batchCount + ')...'
          : 'Построение отчета...';

        google.script.run
          .withSuccessHandler(function(result) {

            if (result.batch) {
              renderBatchResult(infoEl, result);
            } else {
              renderSingleResult(infoEl, result.source, result.reports[0]);
            }

          })
          .withFailureHandler(function(error) {
            infoEl.className = 'error';
            infoEl.textContent = error.message;
          })
          .buildReportFromSidebar(source, activeFilters, compareWith2025, customReportName, cohortOnly);

      });

      document.getElementById('checkDataBtn').addEventListener('click', function() {
        var infoEl = document.getElementById('surveyInfo');
        var source = document.getElementById('dataSource').value;

        infoEl.className = '';
        infoEl.textContent = 'Загрузка...';

        google.script.run
          .withSuccessHandler(function(result) {
            infoEl.className = '';
            infoEl.innerHTML =
              'Источник: ' + result.source + '<br>' +
              'Строк: ' + result.rows + '<br>' +
              'Столбцов: ' + result.columns;
          })
          .withFailureHandler(function(error) {
            infoEl.className = 'error';
            infoEl.textContent = error.message;
          })
          .getSurveyInfo(source);
      });

      updateCompareVisibility();
      updateCohortVisibility();
      loadFilterQuestions();
    </script>
  </body>
</html>
